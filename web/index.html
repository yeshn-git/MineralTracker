<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Mineral Dependency Tracker | Atmanirbhar Bharat</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --alert-red: #ef4444;
            --bg-primary: #030205;
            --bg-secondary: #070709;
            --bg-card: #0e0f10;
            --bg-card-hover: #151617;

            /* Indian tricolor palette */
            --saffron: #FF6F00;
            --saffron-strong: #FF8A00;
            --india-green: #138808;
            --india-navy: #0B3D91;
            --india-white: #ffffff;

            --accent-saffron: var(--saffron);
            --accent-saffron-strong: var(--saffron-strong);
            --accent-green: var(--india-green);
            --accent-navy: var(--india-navy);

            --text-primary: #f6f7f9;
            --text-secondary: #b6c2cc;
            --text-muted: #8c98a4;
            --border-color: #131516;

            --gradient-saffron: linear-gradient(135deg, var(--saffron), var(--saffron-strong));
            --gradient-navy: linear-gradient(135deg, var(--india-navy), rgba(11,61,145,0.7));
            --gradient-hero: linear-gradient(135deg, rgba(2,2,6,0.6), rgba(4,4,12,0.85));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            /* three soft blurred tricolor glows */
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255,111,0,0.16) 0%, transparent 28%),
                radial-gradient(circle at 50% 70%, rgba(255,255,255,0.06) 0%, transparent 30%),
                radial-gradient(circle at 90% 30%, rgba(19,136,8,0.12) 0%, transparent 28%);
            filter: blur(28px);
            opacity: 0.95;
        }

        /* bold blurred paint-stroke for Indian flag (orange - white - green) */
        .flag-stroke {
            position: fixed;
            left: -18%;
            top: 6%;
            width: 140%;
            height: 220px;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(90deg, var(--saffron) 0% 33%, var(--india-white) 33% 66%, var(--india-green) 66% 100%);
            transform: rotate(-12deg) skewX(-8deg);
            border-radius: 80px;
            filter: blur(44px) saturate(150%);
            opacity: 0.95;
            mix-blend-mode: screen;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 160px 160px;
            mix-blend-mode: overlay;
        }

        #root {
            position: relative;
            z-index: 1;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px) scale(0.995); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0px rgba(239,68,68,0); }
            50% { box-shadow: 0 0 20px rgba(239,68,68,0.24); }
            100% { box-shadow: 0 0 0px rgba(239,68,68,0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .animate-fade-in {
            animation: fadeInUp 0.42s cubic-bezier(.2,.9,.25,1) forwards;
        }

        .animate-slide-in {
            animation: slideIn 0.42s cubic-bezier(.2,.9,.25,1) forwards;
        }

        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation-delay: 0.5s; opacity: 0; }
        .stagger-6 { animation-delay: 0.6s; opacity: 0; }

        /* Minimal card hover style for a subtle lift and glow */
        .mineral-card {
            transition: transform 240ms cubic-bezier(.2,.9,.25,1), box-shadow 240ms ease, background-color 180ms ease;
            will-change: transform, box-shadow;
        }
        .mineral-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(2,6,23,0.6), 0 2px 6px rgba(0,0,0,0.6);
            background: var(--bg-card-hover);
        }

        .matrix-point {
            transition: transform 200ms cubic-bezier(.2,.9,.25,1), box-shadow 200ms ease;
            will-change: transform, box-shadow;
        }
        .matrix-point:hover {
            transform: translate(-50%, 50%) scale(1.18);
            box-shadow: 0 10px 30px rgba(2,6,23,0.6);
            z-index: 20;
        }
    </style>
</head>
<body>
                        <div class="bg-pattern"></div>
    <div class="flag-stroke" aria-hidden="true"></div>
    <div class="grid-overlay"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==================== COMPONENTS ====================

        const RiskBadge = ({ level }) => {
            const styles = {
                critical: { bg: 'rgba(239,68,68,0.18)', color: 'var(--alert-red)', border: '1px solid rgba(239,68,68,0.32)' },
                high: { bg: 'rgba(255,138,0,0.14)', color: 'var(--saffron-strong)', border: '1px solid rgba(255,138,0,0.28)' },
                moderate: { bg: 'rgba(11,61,145,0.14)', color: 'var(--india-navy)', border: '1px solid rgba(11,61,145,0.26)' },
                low: { bg: 'rgba(19,136,8,0.14)', color: 'var(--india-green)', border: '1px solid rgba(19,136,8,0.26)' }
            };
            const style = styles[level] || styles.moderate;
            
            return (
                <span style={{
                    padding: '4px 12px',
                    borderRadius: '20px',
                    fontSize: '11px',
                    fontWeight: '600',
                    textTransform: 'uppercase',
                    letterSpacing: '0.5px',
                    backgroundColor: style.bg,
                    color: style.color,
                    border: style.border
                }}>
                    {level}
                </span>
            );
        };

        const TrendIndicator = ({ trend }) => {
            const icons = {
                increasing: '↗',
                decreasing: '↘',
                stable: '→'
            };
            const colors = {
                increasing: 'var(--saffron)',
                decreasing: 'var(--india-green)',
                stable: 'var(--india-navy)'
            };
            return (
                <span style={{ color: colors[trend], fontWeight: '600', fontSize: '16px' }}>
                    {icons[trend]}
                </span>
            );
        };

        const ProgressBar = ({ value, color, label, showValue = true }) => (
            <div style={{ marginBottom: '12px' }}>
                {label && (
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                        <span style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>{label}</span>
                        {showValue && <span style={{ fontSize: '12px', fontWeight: '600', color }}>{value}%</span>}
                    </div>
                )}
                <div style={{
                    height: '8px',
                    backgroundColor: 'rgba(255,255,255,0.1)',
                    borderRadius: '4px',
                    overflow: 'hidden'
                }}>
                    <div style={{
                        width: `${value}%`,
                        height: '100%',
                        backgroundColor: color,
                        borderRadius: '4px',
                        transition: 'width 800ms cubic-bezier(.2,.9,.25,1)'
                    }} />
                </div>
            </div>
        );

        const StatCard = ({ title, value, subtitle, icon, color, delay }) => (
            <div className={`animate-fade-in stagger-${delay}`} style={{
                background: 'var(--bg-card)',
                borderRadius: '16px',
                padding: '24px',
                border: '1px solid var(--border-color)',
                position: 'relative',
                overflow: 'hidden'
            }}>
                <div style={{
                    position: 'absolute',
                    top: '-20px',
                    right: '-20px',
                    width: '100px',
                    height: '100px',
                    background: `radial-gradient(circle, ${color} 0%, rgba(0,0,0,0) 70%)`,
                    opacity: 0.14,
                    borderRadius: '50%'
                }} />
                <div style={{ fontSize: '28px', marginBottom: '12px' }}>{icon}</div>
                <div style={{ fontSize: '12px', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>
                    {title}
                </div>
                <div style={{ fontSize: '36px', fontWeight: '700', color, marginBottom: '4px', fontFamily: 'JetBrains Mono' }}>
                    {value}
                </div>
                <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>{subtitle}</div>
            </div>
        );

        const Header = () => (
            <header style={{
                padding: '20px 40px',
                borderBottom: '1px solid var(--border-color)',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                background: 'rgba(10, 14, 23, 0.8)',
                backdropFilter: 'blur(10px)',
                position: 'sticky',
                top: 0,
                zIndex: 100
            }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                    <div style={{
                        width: '48px',
                        height: '48px',
                        background: 'linear-gradient(135deg, var(--saffron), var(--india-navy))',
                        borderRadius: '12px',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        fontSize: '24px'
                    }}>
                        ⚛
                    </div>
                    <div>
                        <h1 style={{ fontSize: '20px', fontWeight: '700', letterSpacing: '-0.5px' }}>
                            Strategic Mineral Dependency Tracker
                        </h1>
                        <p style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '2px' }}>
                            आत्मनिर्भर भारत • Critical Minerals Intelligence Platform
                        </p>
                    </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '24px' }}>
                    <div style={{
                        padding: '8px 16px',
                        background: 'rgba(239,68,68,0.12)',
                        borderRadius: '8px',
                        border: '1px solid rgba(239,68,68,0.22)',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '8px'
                    }}>
                        <div style={{
                            width: '8px',
                            height: '8px',
                            background: 'var(--alert-red)',
                            borderRadius: '50%',
                            animation: 'pulse-glow 2s infinite'
                        }} />
                        <span style={{ fontSize: '13px', fontWeight: '500', color: 'var(--alert-red)' }}>
                            HIGH DEPENDENCY ALERT
                        </span>
                    </div>
                    
                </div>
            </header>
        );

        const HeroSection = ({ mineralData }) => {
            if (!mineralData || mineralData.length === 0) return null;
            
            const criticalCount = mineralData.filter(m => m.riskLevel === 'critical').length;
            const avgDependency = Math.round(mineralData.reduce((sum, m) => sum + m.chinaImport, 0) / mineralData.length);
            
            return (
                <section style={{
                    padding: '60px 40px',
                    background: 'var(--gradient-hero)',
                    borderBottom: '1px solid var(--border-color)',
                    position: 'relative',
                    overflow: 'hidden'
                }}>
                        <div style={{
                            position: 'absolute',
                            top: '50%',
                            right: '10%',
                            transform: 'translateY(-50%)',
                            width: '420px',
                            height: '420px',
                            background: 'radial-gradient(circle, rgba(255,111,0,0.14) 0%, transparent 65%)',
                            borderRadius: '50%',
                            filter: 'blur(64px)',
                            opacity: 0.95
                        }} />
                    
                    <div style={{ maxWidth: '800px', position: 'relative', zIndex: 1 }}>
                        <div className="animate-fade-in" style={{
                            display: 'inline-block',
                            padding: '6px 16px',
                            background: 'rgba(255,111,0,0.12)',
                            borderRadius: '20px',
                            border: '1px solid rgba(255,111,0,0.2)',
                            marginBottom: '20px'
                        }}>
                            <span style={{ fontSize: '12px', fontWeight: '600', color: 'var(--saffron-strong)', letterSpacing: '1px' }}>
                                🎯 ATMANIRBHAR BHARAT IDEATHON 2025
                            </span>
                        </div>
                        
                        <h2 className="animate-fade-in stagger-1" style={{
                            fontSize: '48px',
                            fontWeight: '800',
                            lineHeight: '1.1',
                            marginBottom: '20px',
                            letterSpacing: '-1px'
                        }}>
                            India's Critical Mineral
                            <br />
                            <span style={{ 
                                background: 'linear-gradient(90deg, var(--saffron), var(--india-navy))',
                                WebkitBackgroundClip: 'text',
                                WebkitTextFillColor: 'transparent'
                            }}>
                                Vulnerability Dashboard
                            </span>
                        </h2>
                        
                        <p className="animate-fade-in stagger-2" style={{
                            fontSize: '18px',
                            color: 'var(--text-secondary)',
                            lineHeight: '1.6',
                            marginBottom: '32px',
                            maxWidth: '600px'
                        }}>
                            Real-time intelligence on India's strategic mineral dependencies, supply chain risks, 
                            and policy recommendations for achieving mineral self-reliance.
                        </p>
                        
                        <div className="animate-fade-in stagger-3" style={{ display: 'flex', gap: '16px' }}>
                            <div style={{
                                    padding: '16px 24px',
                                    background: 'var(--bg-card)',
                                    borderRadius: '12px',
                                    border: '1px solid var(--border-color)'
                                }}>
                                    <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--saffron)', fontFamily: 'JetBrains Mono' }}>
                                        {avgDependency}%
                                    </div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Avg. China Dependency
                                    </div>
                                </div>
                                <div style={{
                                    padding: '16px 24px',
                                    background: 'var(--bg-card)',
                                    borderRadius: '12px',
                                    border: '1px solid var(--border-color)'
                                }}>
                                    <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--saffron-strong)', fontFamily: 'JetBrains Mono' }}>
                                        {criticalCount}
                                    </div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Critical Risk Minerals
                                    </div>
                                </div>
                                <div style={{
                                    padding: '16px 24px',
                                    background: 'var(--bg-card)',
                                    borderRadius: '12px',
                                    border: '1px solid var(--border-color)'
                                }}>
                                    <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--india-navy)', fontFamily: 'JetBrains Mono' }}>
                                        ₹2.8L Cr
                                    </div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Annual Import Value
                                    </div>
                                </div>
                        </div>
                    </div>
                </section>
            );
        };

        const OverviewStats = ({ mineralData }) => {
            if (!mineralData || mineralData.length === 0) return null;
            
            return (
                <section style={{ padding: '40px' }}>
                    <div style={{
                        display: 'grid',
                        gridTemplateColumns: 'repeat(4, 1fr)',
                        gap: '20px'
                    }}>
                        <StatCard
                            title="Tracked Minerals"
                            value={mineralData.length}
                            subtitle="Strategic & Critical"
                            icon="⚗️"
                            color="#0B3D91"
                            delay={1}
                        />
                        <StatCard
                            title="Critical Risk"
                            value={mineralData.filter(m => m.riskLevel === 'critical').length}
                            subtitle="Immediate attention required"
                            icon="🚨"
                            color="#FF6F00"
                            delay={2}
                        />
                        <StatCard
                            title="High Risk"
                            value={mineralData.filter(m => m.riskLevel === 'high').length}
                            subtitle="Elevated concern"
                            icon="⚠️"
                            color="#FF8A00"
                            delay={3}
                        />
                        <StatCard
                            title="Supply Chain Score"
                            value="32/100"
                            subtitle="Resilience index"
                            icon="🛡️"
                            color="#138808"
                            delay={4}
                        />
                    </div>
                </section>
            );
        };

        const MineralCard = ({ mineral, onClick, isSelected }) => (
            <div
                onClick={() => onClick(mineral)}
                className="mineral-card"
                style={{
                    background: isSelected ? 'var(--bg-card-hover)' : 'var(--bg-card)',
                    borderRadius: '16px',
                    padding: '24px',
                    border: isSelected ? '2px solid var(--accent-info)' : '1px solid var(--border-color)',
                    cursor: 'pointer',
                    transition: 'all 0.3s ease',
                    position: 'relative',
                    overflow: 'hidden'
                }}
            >
                <div style={{
                    position: 'absolute',
                    top: 0,
                    left: 0,
                    width: '4px',
                    height: '100%',
                    background: mineral.riskLevel === 'critical' ? 'var(--alert-red)' : 
                               mineral.riskLevel === 'high' ? 'var(--saffron-strong)' : 'var(--india-navy)'
                }} />
                
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' }}>
                    <div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '4px' }}>
                            <h3 style={{ fontSize: '18px', fontWeight: '600' }}>{mineral.name}</h3>
                            <span style={{
                                fontSize: '14px',
                                fontWeight: '600',
                                color: 'var(--text-muted)',
                                fontFamily: 'JetBrains Mono',
                                background: 'rgba(255,255,255,0.05)',
                                padding: '2px 8px',
                                borderRadius: '4px'
                            }}>
                                {mineral.symbol}
                            </span>
                        </div>
                        <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{mineral.category}</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <TrendIndicator trend={mineral.trend} />
                        <RiskBadge level={mineral.riskLevel} />
                    </div>
                </div>
                
                <ProgressBar
                    value={mineral.chinaImport}
                    color={mineral.chinaImport > 80 ? 'var(--alert-red)' : mineral.chinaImport > 60 ? 'var(--saffron-strong)' : 'var(--india-green)'}
                    label="China Import Dependency"
                />
                
                <div style={{ display: 'flex', gap: '16px', marginTop: '16px' }}>
                    <div style={{ flex: 1 }}>
                        <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '4px' }}>Supply Risk</div>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: 'var(--alert-red)', fontFamily: 'JetBrains Mono' }}>
                            {mineral.supplyChainRisk}%
                        </div>
                    </div>
                    <div style={{ flex: 1 }}>
                        <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '4px' }}>Domestic</div>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: 'var(--india-green)', fontFamily: 'JetBrains Mono' }}>
                            {mineral.domesticProduction}%
                        </div>
                    </div>
                    <div style={{ flex: 1 }}>
                        <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '4px' }}>Volatility</div>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: 'var(--saffron-strong)', fontFamily: 'JetBrains Mono' }}>
                            {mineral.priceVolatility}%
                        </div>
                    </div>
                </div>
            </div>
        );

        const MineralDetailPanel = ({ mineral }) => {
            if (!mineral) {
                return (
                    <div style={{
                        background: 'var(--bg-card)',
                        borderRadius: '16px',
                        padding: '40px',
                        border: '1px solid var(--border-color)',
                        height: '100%',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        textAlign: 'center'
                    }}>
                        <div>
                            <div style={{ fontSize: '48px', marginBottom: '16px', opacity: 0.3 }}>⚛</div>
                            <p style={{ color: 'var(--text-muted)' }}>Select a mineral to view detailed analysis</p>
                        </div>
                    </div>
                );
            }

            return (
                <div style={{
                    background: 'var(--bg-card)',
                    borderRadius: '16px',
                    padding: '28px',
                    border: '1px solid var(--border-color)',
                    height: '100%',
                    overflow: 'auto'
                }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '24px' }}>
                        <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
                                <h2 style={{ fontSize: '28px', fontWeight: '700' }}>{mineral.name}</h2>
                                <span style={{
                                    fontSize: '18px',
                                    fontWeight: '600',
                                    color: 'var(--accent-cyan)',
                                    fontFamily: 'JetBrains Mono',
                                    background: 'rgba(6, 182, 212, 0.1)',
                                    padding: '4px 12px',
                                    borderRadius: '6px'
                                }}>
                                    {mineral.symbol}
                                </span>
                            </div>
                            <p style={{ color: 'var(--text-secondary)' }}>{mineral.category}</p>
                        </div>
                        <RiskBadge level={mineral.riskLevel} />
                    </div>

                    <div style={{
                        display: 'grid',
                        gridTemplateColumns: 'repeat(3, 1fr)',
                        gap: '16px',
                        marginBottom: '28px'
                    }}>
                        <div style={{
                            background: 'rgba(255,111,0,0.12)',
                            borderRadius: '12px',
                            padding: '16px',
                            border: '1px solid rgba(255,111,0,0.22)'
                        }}>
                            <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                China Dependency
                            </div>
                            <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--saffron)', fontFamily: 'JetBrains Mono' }}>
                                {mineral.chinaImport}%
                            </div>
                        </div>
                        <div style={{
                            background: 'rgba(255,138,0,0.10)',
                            borderRadius: '12px',
                            padding: '16px',
                            border: '1px solid rgba(255,138,0,0.18)'
                        }}>
                            <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                Total Import
                            </div>
                            <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--saffron-strong)', fontFamily: 'JetBrains Mono' }}>
                                {mineral.totalImport}%
                            </div>
                        </div>
                        <div style={{
                            background: 'rgba(19,136,8,0.08)',
                            borderRadius: '12px',
                            padding: '16px',
                            border: '1px solid rgba(19,136,8,0.16)'
                        }}>
                            <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '8px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                Domestic Production
                            </div>
                            <div style={{ fontSize: '32px', fontWeight: '700', color: 'var(--india-green)', fontFamily: 'JetBrains Mono' }}>
                                {mineral.domesticProduction}%
                            </div>
                        </div>
                    </div>

                    <div style={{ marginBottom: '28px' }}>
                        <h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '16px', color: 'var(--text-secondary)' }}>
                            5-YEAR CHINA DEPENDENCY TREND
                        </h4>
                        <div style={{ display: 'flex', alignItems: 'flex-end', gap: '8px', height: '80px' }}>
                            {mineral.yearlyData.map((value, index) => (
                                <div key={index} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                                                <div style={{
                                                    width: '100%',
                                                    height: `${value * 0.8}px`,
                                                    background: index === mineral.yearlyData.length - 1 
                                                        ? 'linear-gradient(180deg, var(--saffron) 0%, var(--saffron-strong) 100%)'
                                                        : 'rgba(255,111,0,0.32)',
                                                    borderRadius: '4px 4px 0 0',
                                                    transition: 'height 420ms cubic-bezier(.2,.9,.25,1)'
                                                }} />
                                    <span style={{ fontSize: '10px', color: 'var(--text-muted)', marginTop: '8px' }}>
                                        {2020 + index}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div style={{ marginBottom: '28px' }}>
                        <h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px', color: 'var(--text-secondary)' }}>
                            STRATEGIC APPLICATIONS
                        </h4>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                            {mineral.strategicUse.map((use, index) => (
                                <span key={index} style={{
                                    padding: '6px 14px',
                                    background: 'rgba(11,61,145,0.08)',
                                    border: '1px solid rgba(11,61,145,0.18)',
                                    borderRadius: '20px',
                                    fontSize: '12px',
                                    color: 'var(--india-navy)'
                                }}>
                                    {use}
                                </span>
                            ))}
                        </div>
                    </div>

                    <div style={{ marginBottom: '28px' }}>
                        <h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px', color: 'var(--text-secondary)' }}>
                            🇮🇳 DOMESTIC INITIATIVES
                        </h4>
                        <ul style={{ listStyle: 'none', padding: 0 }}>
                            {mineral.domesticInitiatives.map((initiative, index) => (
                                <li key={index} style={{
                                    padding: '10px 14px',
                                    background: 'rgba(16, 185, 129, 0.05)',
                                    borderRadius: '8px',
                                    marginBottom: '8px',
                                    fontSize: '13px',
                                    color: 'var(--text-primary)',
                                    borderLeft: '3px solid var(--india-green)'
                                }}>
                                    {initiative}
                                </li>
                            ))}
                        </ul>
                    </div>

                    <div>
                        <h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px', color: 'var(--text-secondary)' }}>
                            ALTERNATIVE TECHNOLOGIES
                        </h4>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                            {mineral.alternatives.map((alt, index) => (
                                <span key={index} style={{
                                    padding: '6px 14px',
                                    background: 'rgba(139, 92, 246, 0.1)',
                                    border: '1px solid rgba(139, 92, 246, 0.3)',
                                    borderRadius: '20px',
                                    fontSize: '12px',
                                    color: 'var(--india-navy)'
                                }}>
                                    {alt}
                                </span>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const MineralsSection = ({ mineralData, selectedMineral, setSelectedMineral }) => {
            if (!mineralData || mineralData.length === 0) return null;
            
            return (
                <section style={{ padding: '0 40px 40px' }}>
                    <div style={{ marginBottom: '24px' }}>
                        <h2 style={{ fontSize: '24px', fontWeight: '700', marginBottom: '8px' }}>
                            Critical Mineral Analysis
                        </h2>
                        <p style={{ color: 'var(--text-secondary)' }}>
                            Click on any mineral card to view detailed dependency analysis and mitigation strategies
                        </p>
                    </div>
                    
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }}>
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(2, 1fr)',
                            gap: '16px',
                            alignContent: 'start'
                        }}>
                            {mineralData.map(mineral => (
                                <MineralCard
                                    key={mineral.id}
                                    mineral={mineral}
                                    onClick={setSelectedMineral}
                                    isSelected={selectedMineral?.id === mineral.id}
                                />
                            ))}
                        </div>
                        <div style={{ position: 'sticky', top: '100px', height: 'fit-content' }}>
                            <MineralDetailPanel mineral={selectedMineral} />
                        </div>
                    </div>
                </section>
            );
        };

        // Risk Matrix Section
        const RiskMatrix = ({ mineralData }) => {
            if (!mineralData || mineralData.length === 0) return null;
            
            return (
                <section style={{ padding: '40px', background: 'var(--bg-secondary)' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '700', marginBottom: '8px' }}>
                        Risk Assessment Matrix
                    </h2>
                    <p style={{ color: 'var(--text-secondary)', marginBottom: '32px' }}>
                        Supply chain risk vs. China dependency visualization
                    </p>
                    
                    <div style={{
                        background: 'var(--bg-card)',
                        borderRadius: '16px',
                        padding: '32px',
                        border: '1px solid var(--border-color)',
                        position: 'relative'
                    }}>
                        <div style={{
                            position: 'absolute',
                            left: '0',
                            top: '50%',
                            transform: 'rotate(-90deg) translateX(-50%)',
                            fontSize: '12px',
                            color: 'var(--text-muted)',
                            whiteSpace: 'nowrap'
                        }}>
                            Supply Chain Risk →
                        </div>
                        
                        <div style={{
                            position: 'absolute',
                            bottom: '8px',
                            left: '50%',
                            transform: 'translateX(-50%)',
                            fontSize: '12px',
                            color: 'var(--text-muted)'
                        }}>
                            China Dependency →
                        </div>
                        
                        <div style={{
                            width: 'calc(100% - 80px)',
                            height: '400px',
                            marginLeft: '60px',
                            marginBottom: '40px',
                            position: 'relative',
                            background: `
                                linear-gradient(to right, rgba(16, 185, 129, 0.1) 0%, rgba(245, 158, 11, 0.1) 50%, rgba(239, 68, 68, 0.1) 100%),
                                linear-gradient(to top, rgba(16, 185, 129, 0.1) 0%, rgba(245, 158, 11, 0.1) 50%, rgba(239, 68, 68, 0.1) 100%)
                            `,
                            borderRadius: '8px',
                            border: '1px solid var(--border-color)',
                            overflow: 'hidden'
                        }}>
                            {[25, 50, 75].map(pos => (
                                <React.Fragment key={pos}>
                                    <div style={{
                                        position: 'absolute',
                                        left: `${pos}%`,
                                        top: 0,
                                        bottom: 0,
                                        width: '1px',
                                        background: 'rgba(255,255,255,0.05)'
                                    }} />
                                    <div style={{
                                        position: 'absolute',
                                        top: `${100 - pos}%`,
                                        left: 0,
                                        right: 0,
                                        height: '1px',
                                        background: 'rgba(255,255,255,0.05)'
                                    }} />
                                </React.Fragment>
                            ))}
                            
                            {mineralData.map(mineral => {
                                const xPos = Math.min(Math.max(mineral.chinaImport, 8), 92);
                                const yPos = Math.min(Math.max(mineral.supplyChainRisk, 8), 92);
                                
                                    return (
                                    <div
                                        key={mineral.id}
                                        className="matrix-point"
                                        style={{
                                            position: 'absolute',
                                            left: `${xPos}%`,
                                            bottom: `${yPos}%`,
                                            transform: 'translate(-50%, 50%)',
                                            width: '40px',
                                            height: '40px',
                                            borderRadius: '50%',
                                            background: mineral.riskLevel === 'critical' ? 'rgba(239,68,68,0.92)' :
                                                       mineral.riskLevel === 'high' ? 'rgba(255,138,0,0.88)' : 'rgba(11,61,145,0.88)',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            fontSize: '11px',
                                            fontWeight: '600',
                                            cursor: 'pointer',
                                            border: '2px solid rgba(255,255,255,0.12)',
                                            zIndex: 10
                                        }}
                                        title={`${mineral.name}: ${mineral.chinaImport}% China Dep., ${mineral.supplyChainRisk}% Risk`}
                                    >
                                        {mineral.symbol}
                                    </div>
                                );
                            })}
                        </div>
                        
                        <div style={{ display: 'flex', justifyContent: 'center', gap: '32px', marginTop: '16px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <div style={{ width: '16px', height: '16px', borderRadius: '50%', background: 'var(--alert-red)' }} />
                                <span style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Critical</span>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <div style={{ width: '16px', height: '16px', borderRadius: '50%', background: 'var(--saffron-strong)' }} />
                                <span style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>High</span>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <div style={{ width: '16px', height: '16px', borderRadius: '50%', background: 'var(--india-navy)' }} />
                                <span style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Moderate</span>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        const GeopoliticalTimeline = ({ events }) => {
            if (!events || events.length === 0) return null;
            
            return (
                <section style={{ padding: '40px', background: 'var(--bg-secondary)' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '700', marginBottom: '8px' }}>
                        Geopolitical Events & Supply Chain Disruptions
                    </h2>
                    <p style={{ color: 'var(--text-secondary)', marginBottom: '32px' }}>
                        Recent events impacting India's mineral supply security
                    </p>
                    
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                        {events.map((event, index) => (
                            <div
                                key={index}
                                className="animate-slide-in"
                                style={{
                                    display: 'flex',
                                    gap: '20px',
                                    padding: '20px',
                                    background: 'var(--bg-card)',
                                    borderRadius: '12px',
                                    border: '1px solid var(--border-color)',
                                    animationDelay: `${index * 0.1}s`
                                }}
                            >
                                <div style={{
                                    width: '100px',
                                    flexShrink: 0,
                                    fontFamily: 'JetBrains Mono',
                                    fontSize: '14px',
                                    color: 'var(--text-muted)'
                                }}>
                                    {event.date}
                                </div>
                                <div style={{
                                    width: '4px',
                                    borderRadius: '2px',
                                    background: event.impact === 'critical' ? 'var(--alert-red)' :
                                               event.impact === 'high' ? 'var(--saffron-strong)' :
                                               event.impact === 'positive' ? 'var(--india-green)' : 'var(--india-navy)'
                                }} />
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontSize: '15px', fontWeight: '500', marginBottom: '8px' }}>
                                        {event.event}
                                    </div>
                                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                                        {event.minerals.map((mineral, i) => (
                                            <span key={i} style={{
                                                padding: '4px 10px',
                                                background: 'rgba(255,255,255,0.05)',
                                                borderRadius: '4px',
                                                fontSize: '11px',
                                                color: 'var(--text-secondary)'
                                            }}>
                                                {mineral}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <span style={{
                                        padding: '4px 12px',
                                        borderRadius: '4px',
                                        fontSize: '11px',
                                        fontWeight: '600',
                                        textTransform: 'uppercase',
                                        background: event.impact === 'critical' ? 'rgba(239, 68, 68, 0.2)' :
                                                   event.impact === 'high' ? 'rgba(245, 158, 11, 0.2)' :
                                                   event.impact === 'positive' ? 'rgba(16, 185, 129, 0.2)' : 'rgba(59, 130, 246, 0.2)',
                                                color: event.impact === 'critical' ? 'var(--alert-red)' :
                                                    event.impact === 'high' ? 'var(--saffron-strong)' :
                                                    event.impact === 'positive' ? 'var(--india-green)' : 'var(--india-navy)'
                                    }}>
                                        {event.impact}
                                    </span>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const PolicyRecommendations = ({ recommendations }) => {
            if (!recommendations || recommendations.length === 0) return null;
            
            return (
                <section style={{ padding: '40px' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '700', marginBottom: '8px' }}>
                        Policy Recommendations
                    </h2>
                    <p style={{ color: 'var(--text-secondary)', marginBottom: '32px' }}>
                        Strategic roadmap for achieving mineral self-reliance
                    </p>
                    
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '24px' }}>
                        {recommendations.map((rec, index) => (
                            <div
                                key={index}
                                style={{
                                    background: 'var(--bg-card)',
                                    borderRadius: '16px',
                                    padding: '28px',
                                    border: '1px solid var(--border-color)'
                                }}
                            >
                                <div style={{
                                    display: 'inline-block',
                                    padding: '6px 14px',
                                    background: index === 0 ? 'rgba(239, 68, 68, 0.15)' :
                                               index === 1 ? 'rgba(245, 158, 11, 0.15)' : 'rgba(16, 185, 129, 0.15)',
                                    borderRadius: '20px',
                                    marginBottom: '20px'
                                }}>
                                    <span style={{
                                        fontSize: '12px',
                                        fontWeight: '600',
                                        color: index === 0 ? 'var(--saffron)' : index === 1 ? 'var(--saffron-strong)' : 'var(--india-green)'
                                    }}>
                                        {rec.category}
                                    </span>
                                </div>
                                
                                <ul style={{ listStyle: 'none', padding: 0 }}>
                                    {rec.items.map((item, i) => (
                                        <li key={i} style={{
                                            padding: '12px 0',
                                            borderBottom: i < rec.items.length - 1 ? '1px solid var(--border-color)' : 'none',
                                            fontSize: '14px',
                                            color: 'var(--text-primary)',
                                            display: 'flex',
                                            alignItems: 'flex-start',
                                            gap: '12px'
                                        }}>
                                            <span style={{
                                                color: index === 0 ? 'var(--saffron)' : index === 1 ? 'var(--saffron-strong)' : 'var(--india-green)',
                                                fontWeight: '600'
                                            }}>→</span>
                                            {item}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer style={{
                padding: '40px',
                borderTop: '1px solid var(--border-color)',
                textAlign: 'center'
            }}>
                <div style={{ marginBottom: '16px' }}>
                    <span style={{ 
                        fontSize: '24px', 
                        fontWeight: '700',
                        background: 'linear-gradient(90deg, var(--saffron-strong), var(--saffron))',
                        WebkitBackgroundClip: 'text',
                        WebkitTextFillColor: 'transparent'
                    }}>
                        आत्मनिर्भर भारत
                    </span>
                </div>
                <p style={{ color: 'var(--text-muted)', fontSize: '14px', marginBottom: '8px' }}>
                    Strategic Mineral Dependency Tracker
                </p>
                <p style={{ color: 'var(--text-muted)', fontSize: '12px' }}>
                    Built for India's self-reliance in critical minerals
                </p>
            </footer>
        );

        // Main App Component
        const App = () => {
            const [selectedMineral, setSelectedMineral] = useState(null);
            const [mineralData, setMineralData] = useState([]);
            const [geopoliticalEvents, setGeopoliticalEvents] = useState([]);
            const [policyRecommendations, setPolicyRecommendations] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        setLoading(true);
                        
                        const [mineralsRes, eventsRes, policyRes] = await Promise.all([
                            fetch('http://localhost:5000/api/minerals'),
                            fetch('http://localhost:5000/api/events'),
                            fetch('http://localhost:5000/api/policy')
                        ]);
                        
                        if (!mineralsRes.ok || !eventsRes.ok || !policyRes.ok) {
                            throw new Error('Failed to fetch data from API. Make sure Flask server is running at http://localhost:5000');
                        }
                        
                        const mineralsData = await mineralsRes.json();
                        const eventsData = await eventsRes.json();
                        const policyData = await policyRes.json();
                        
                        setMineralData(mineralsData);
                        setGeopoliticalEvents(eventsData);
                        setPolicyRecommendations(policyData);
                        setLoading(false);
                        
                        const firstCritical = mineralsData.find(m => m.riskLevel === 'critical');
                        if (firstCritical) setSelectedMineral(firstCritical);
                        
                        console.log('✅ Data loaded from API:', mineralsData.length, 'minerals');
                    } catch (error) {
                        console.error('❌ Error loading data:', error);
                        setError(error.message);
                        setLoading(false);
                    }
                };
                
                fetchData();
            }, []);

            if (loading) {
                return (
                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        height: '100vh',
                        flexDirection: 'column',
                        gap: '20px'
                    }}>
                        <div style={{
                            width: '60px',
                            height: '60px',
                            border: '4px solid rgba(11,61,145,0.18)',
                            borderTopColor: 'var(--india-navy)',
                            borderRadius: '50%',
                            animation: 'spin 1s linear infinite'
                        }} />
                        <p style={{ color: 'var(--text-secondary)' }}>Loading mineral data from database...</p>
                    </div>
                );
            }

            if (error) {
                return (
                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        height: '100vh',
                        flexDirection: 'column',
                        gap: '20px',
                        padding: '40px'
                    }}>
                        <div style={{ fontSize: '48px' }}>⚠️</div>
                        <h2 style={{ color: 'var(--alert-red)' }}>Failed to Load Data</h2>
                        <p style={{ color: 'var(--text-secondary)', textAlign: 'center', maxWidth: '500px' }}>
                            {error}
                        </p>
                        <p style={{ color: 'var(--text-muted)', fontSize: '14px' }}>
                            Make sure Flask API is running at http://localhost:5000
                        </p>
                        <button 
                            onClick={() => window.location.reload()} 
                            style={{
                                padding: '12px 24px',
                                background: 'var(--india-navy)',
                                color: 'white',
                                border: 'none',
                                borderRadius: '8px',
                                cursor: 'pointer',
                                fontSize: '14px',
                                fontWeight: '600'
                            }}
                        >
                            Retry
                        </button>
                    </div>
                );
            }

            return (
                <div>
                    <Header />
                    <HeroSection mineralData={mineralData} />
                    <OverviewStats mineralData={mineralData} />
                    <MineralsSection 
                        mineralData={mineralData}
                        selectedMineral={selectedMineral} 
                        setSelectedMineral={setSelectedMineral} 
                    />
                    <RiskMatrix mineralData={mineralData} />
                    <GeopoliticalTimeline events={geopoliticalEvents} />
                    <PolicyRecommendations recommendations={policyRecommendations} />
                    <Footer />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
